<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Помощник студента ВГУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/style.css?v=10">
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="blob blob-5"></div>
</div>

<div id="app">
  <div class="page" id="page-home"></div>
  <div class="page" id="page-schedule"></div>
  <div class="page" id="page-brs"></div>
  <div class="page" id="page-calc"></div>
  <div class="page" id="page-profile"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" id="nav-home" onclick="goTo('home')">
    <div class="nav-icon-wrap">
      <i data-lucide="calendar-days"></i>
    </div>
    Сегодня
  </button>
  <button class="nav-item" id="nav-schedule" onclick="goTo('schedule')">
    <div class="nav-icon-wrap">
      <i data-lucide="clock"></i>
    </div>
    Расписание
  </button>
  <button class="nav-item" id="nav-brs" onclick="goTo('brs')">
    <div class="nav-icon-wrap">
      <i data-lucide="bar-chart-3"></i>
    </div>
    Оценки
  </button>
  <button class="nav-item" id="nav-calc" onclick="goTo('calc')">
    <div class="nav-icon-wrap">
      <i data-lucide="calculator"></i>
    </div>
    Калькулятор
  </button>
  <button class="nav-item" id="nav-profile" onclick="goTo('profile')">
    <div class="nav-icon-wrap">
      <i data-lucide="user"></i>
    </div>
    Профиль
  </button>
</nav>

<script src="/js/app.js?v=13"></script>
</body>
</html>
